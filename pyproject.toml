[project]
name = "fungod"
version = "0.0.3"
description = "周易六十四卦占卜工具：基于大衍之数算法模拟蓍草占卜，生成六爻卦象并输出卦名与卦辞"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fungod"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# 六十四卦卦辞原文，长句不拆行以免破坏文本内容。
"src/fungod/data/gua_ci/gwill_solution.py" = ["E501"]
