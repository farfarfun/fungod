[project]
name = "fungod"
version = "0.0.3"
description = "fungod"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["readme-renderer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fungod"]

[dependency-groups]
dev = ["pytest>=7.0"]
